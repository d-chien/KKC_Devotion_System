<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKC 管理後台</title>
    <link rel="icon" type="image/svg+xml" href="/media/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <div class="flex justify-center mb-4">
            <img src="/media/logo_bgrm.svg" alt="KKC Logo" class="h-16 w-auto">
        </div>
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">管理員登入</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">帳號</label>
                <input type="text" id="username"
                    class="mt-1 w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">密碼</label>
                <input type="password" id="password"
                    class="mt-1 w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    required>
            </div>
            <button type="submit"
                class="w-full py-2 px-4 bg-gray-800 text-white rounded-md hover:bg-gray-700 font-medium">登入</button>
        </form>
        <p id="error-msg" class="mt-4 text-red-500 text-sm text-center hidden"></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                // Ensure we use the proper API URL (relative path works if hosted same domain, which they are)
                const res = await fetch('/api/auth/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    // Successful login. The backend sets the session cookie.
                    // If the backend returns a redirect, fetch might follow it, 
                    // or we check res.url.
                    // Given we returned a RedirectResponse with 303, fetch follows it automatically.
                    // So res.url should be the dashboard url.
                    window.location.href = '/admin/dashboard.html';
                } else {
                    const data = await res.json();
                    errorMsg.textContent = data.detail || '登入失敗';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = '系統錯誤，請稍後再試';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
