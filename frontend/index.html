<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KKC 奉獻系統 — 查詢個人奉獻紀錄">
    <title>KKC 奉獻系統</title>
    <link rel="icon" type="image/svg+xml" href="/media/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- Login View -->
    <div id="login-view" class="hidden flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <img src="/media/logo_bgrm.svg" alt="KKC Logo" class="h-20 w-auto mx-auto mb-4">
            <h1 class="text-3xl font-bold mb-2 text-indigo-600">KKC 奉獻系統</h1>
            <p class="text-gray-500 mb-8">請登入以查看您的奉獻紀錄</p>
            <a href="/api/auth/line/login"
                class="inline-flex items-center justify-center w-full px-6 py-3 bg-[#06C755] hover:bg-[#05b34c] text-white font-bold rounded-lg transition duration-200">
                <svg class="w-6 h-6 mr-2" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M21.15 8.94C20.5 4.09 16.59 0 11.23 0 5.09 0 0 4.96 0 11.23c0 5.48 4.29 9.99 9.68 10.96V19c0-.46.33-.86.78-.96.48-.11.96.16 1.15.61l1.52 4.02c.16.43.58.71 1.04.71.05 0 .1-.01.15-.02.5-.09.84-.56.75-1.07l-.61-3.23c1.78-.4 3.42-1.39 4.69-2.82 2.38-2.69 2.59-6.38.64-8.86-.46-.58-1-.96-1.64-1.29z" />
                </svg>
                使用 LINE 登入
            </a>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="hidden">
        <nav class="bg-white shadow-sm sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <img src="/media/logo_bgrm.svg" alt="Logo" class="h-8 w-auto mr-3">
                        <span class="text-xl font-bold text-indigo-600">奉獻儀表板</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="text-sm text-right hidden sm:block">
                            <div id="user-name" class="font-medium text-gray-900">Loading...</div>
                            <div id="user-id" class="text-gray-500 text-xs">ID: ...</div>
                        </div>
                        <button onclick="logout()" class="text-gray-500 hover:text-gray-700">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Total Amount -->
                <div class="bg-white overflow-hidden shadow rounded-2xl p-6 relative">
                    <dt class="text-sm font-medium text-gray-500 truncate">總奉獻金額</dt>
                    <dd class="mt-1 text-3xl font-semibold text-gray-900 flex items-center">
                        <span id="total-amount">****</span>
                        <button onclick="toggleAmount()"
                            class="ml-3 text-gray-400 hover:text-gray-600 focus:outline-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                                <path fill-rule="evenodd"
                                    d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
                                    clip-rule="evenodd" />
                            </svg>
                        </button>
                    </dd>
                </div>
                <!-- Count -->
                <div class="bg-white overflow-hidden shadow rounded-2xl p-6">
                    <dt class="text-sm font-medium text-gray-500 truncate">總奉獻次數</dt>
                    <dd class="mt-1 text-3xl font-semibold text-gray-900" id="total-count">-</dd>
                </div>
            </div>

            <!-- List -->
            <div class="bg-white shadow rounded-2xl overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-200">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">奉獻明細</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    日期</th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    類別</th>
                                <th scope="col"
                                    class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    金額</th>
                            </tr>
                        </thead>
                        <tbody id="devotion-list" class="bg-white divide-y divide-gray-200">
                            <!-- JS will populate -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white shadow rounded-2xl p-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">奉獻類別比例</h3>
                    <div class="relative h-64">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
                <div class="bg-white shadow rounded-2xl p-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">奉獻金額</h3>
                    <div class="relative h-64">
                        <canvas id="historyChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bind Modal -->
    <div id="bind-modal" class="fixed z-50 inset-0 overflow-y-auto hidden" aria-labelledby="modal-title" role="dialog"
        aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div
                class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">首次綁定</h3>
                            <div class="mt-2 text-sm text-gray-500">
                                請輸入您的<b>完整姓名</b>與會友編號以進行綁定審核。
                            </div>
                            <div class="mt-4 space-y-4">
                                <input type="text" id="bind-id" placeholder="會友編號"
                                    class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                <input type="text" id="bind-name" placeholder="完整姓名"
                                    class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" onclick="submitBind()"
                        class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">綁定</button>
                    <!-- No cancel for mandatory bind -->
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>

</html>
